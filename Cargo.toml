[package]
name = "atoll"
version = "0.1.0"
edition = "2021"

[dependencies]
async-channel = "2.5.0"
async-io = "2.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
gdk4-x11 = "0.11.5"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x11rb = { version = "0.14.0", features = ["randr", "xinput"] }
zbus = "5"

[build-dependencies]
glib-build-tools = "0.22.8"
