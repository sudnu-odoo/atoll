# Every push and pull request: format, lint, unit and integration tests.
# Every push to main that passes: the next version is released
# automatically (.deb on the Releases page, which Atoll's updater reads).
#
# Version bump: patch by default (0.1.4 -> 0.1.5). Put [minor] or [major]
# in a commit message to bump those instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One release at a time, so two pushes can't claim the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # A virtual X display, so the off-screen card render runs too.
      - name: Unit and integration tests
        run: xvfb-run -a cargo test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and history, for the version and notes

      - name: Next version and release notes
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; fi
          if [ -z "$(git log --format=%H $range)" ]; then
            echo "Nothing new since $last"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          messages=$(git log --format=%B $range)
          if grep -q '\[major\]' <<< "$messages"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -q '\[minor\]' <<< "$messages"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Commit titles since the last release: Atoll shows these as
          # "What's new" before updating.
          git log --no-merges --format='- %s' $range > notes.md
          echo "Releasing $version"; cat notes.md

      - name: Build dependencies
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip != 'true'

      - name: Build the package
        if: steps.version.outputs.skip != 'true'
        env:
          ATOLL_VERSION: ${{ steps.version.outputs.version }}
        run: packaging/build-deb.sh

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Atoll ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: target/debian/*.deb
