# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to
# build the .deb on Ubuntu 24.04 and publish it on the GitHub Releases page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the .deb

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Build the package
        run: packaging/build-deb.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
          generate_release_notes: true
